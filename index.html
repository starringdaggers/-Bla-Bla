<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Green to Orange Vibes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #b7f3c0 0%, #ffd59e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2d3a2f;
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #2ecc71, #ff8c42);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
