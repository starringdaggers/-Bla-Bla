<!DOCTYPE html >
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenOrange Wallet</title>
<style>
    * { box-sizing: border-box; font-family: "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #b7e4c7 0%, #95d5b2 40%, #ffb347 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .card {
    background: white;
    width: 100%;
    max-width: 380px;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }

  .logo {
    text-align: center;
    margin-bottom: 18px;
  }
  .logo h1 {
    font-size: 24px;
    background: linear-gradient(90deg, #52b788, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }
  .logo p { color: #666; font-size: 14px; margin-top: 4px; }

  .welcome {
    display: none;
    text-align: center;
  }
  .welcome h2 { color: #52b788; margin-bottom: 8px; }

  .form-group { margin-bottom: 16px; }
  label { font-size: 13px; color: #444; margin-bottom: 6px; display: block; font-weight: 600; }
  
  input {
    width: 100%;
    padding: 14px;
    border: 1.5px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
  }
  input:focus {
    border-color: #ff8c00;
    box-shadow: 0 0 0 3px rgba(255,140,0,0.1);
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #52b788, #ff8c00);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }

  .footer { text-align: center; font-size: 12px; color: #777; margin-top: 16px; }
  .error { color: #e63946; font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>GreenOrange Wallet</h1>
      <p>Send money. Pay bills. Stay bright.</p>
    </div>

    <div id="loginForm">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="0801 234 5678" maxlength="11">
      </div>
      <div class="form-group">
        <label>4-Digit PIN</label>
        <input type="password" id="pin" placeholder="****" maxlength="4">
      </div>
      <button class="btn" onclick="handleLogin()">Login</button>
      <p id="error" class="error">Please enter a valid phone and 4-digit PIN</p>
      <p class="footer">Demo only. No real data is sent.</p>
    </div>

    <div id="welcomeScreen" class="welcome">
      <h2>Welcome back!</h2>
      <p id="welcomeText"></p>
      <button class="btn" style="margin-top:20px; background:#ccc; color:#333;" onclick="logout()">Logout</button>
    </div>
  </div>

<script>
  function handleLogin() {
    const phone = document.getElementById('phone').value.trim();
    const pin = document.getElementById('pin').value.trim();
    const error = document.getElementById('error');

    // Simple validation like Opay: 11 digits phone, 4 digit pin
    if(phone.length >= 10 && pin.length === 4 && !isNaN(pin)) {
      error.style.display = 'none';
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('welcomeScreen').style.display = 'block';
      document.getElementById('welcomeText').innerText = 
        `Hi there! You logged in with ${phone}. Your GreenOrange balance is ₦12,450.00`;
    } else {
      error.style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('phone').value = '';
    document.getElementById('pin').value = '';
  }
</script>
</body>
</html>
