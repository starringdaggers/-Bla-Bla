<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Green to Orange Vibes</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #b7f3c0 0%, #ffd59e 50%, #ff8c42 100%);
    background-size: 200% 200%;
    animation: gradientShift 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .login-card {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    padding: 40px 35px;
    border-radius: 20px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    animation: float 6s ease-in-out infinite;
    text-align: center;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }

  .login-card h1 {
    font-size: 2rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #2ecc71, #ff8c42);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .login-card p {
    color: #444;
    margin-bottom: 25px;
    font-size: 0.95rem;
  }

  .input-group {
    text-align: left;
    margin-bottom: 18px;
  }

  .input-group label {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 6px;
    color: #333;
    font-weight: 600;
  }

  .input-group input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: rgba(255,255,255,0.9);
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  .input-group input:focus {
    outline: none;
    border-color: #ff8c42;
    box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.2);
  }

  .options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }

  .options a {
    color: #ff8c42;
    text-decoration: none;
    font-weight: 600;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #2ecc71, #ff8c42);
    color: white;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .btn:hover {
    transform: scale(1.03);
  }

  .signup {
    margin-top: 20px;
    font-size: 0.9rem;
    color: #333;
  }

  .signup a {
    color: #2ecc71;
    text-decoration: none;
    font-weight: 700;
  }
</style>
</head>

  <div
