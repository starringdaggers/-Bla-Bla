<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenOrange Wallet</title>
<style>
    * { box-sizing: border-box; font-family: "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #b7e4c7 0%, #95d5b2 40%, #ffb347 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .card {
    background: white;
    width: 100%;
    max-width: 380px;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }

  .logo {
    text-align: center;
    margin-bottom: 18px;
  }
  .logo h1 {
    font-size: 24px;
    background: linear-gradient(90deg, #52b788, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }
  .logo p { color: #666; font-size: 14px; margin-top: 4px; }

  .welcome {
    display: none;
    text-align: center;
  }
  .welcome h2 { color: #52b788; margin-bottom: 8px; }

  .form-group { margin-bottom: 16px; }
  label { font-size: 13px; color: #444; margin-bottom: 6px; display: block; font-weight: 600; }
  
  input {
    width: 100%;
    padding: 14px;
    border: 1.5px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
  }
  input:focus {
    border-color: #ff8c00;
    box-shadow: 0 0 0 3px rgba(255,140,0,0.1);
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #52b788, #ff8c00);
    color: white;
    font-size: 16px;
    font-weight: 700;
